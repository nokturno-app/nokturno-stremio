name: testy
# testy jen na tag vydání, PR a ručně (od 2026-10-10: týdenní rytmus vydání, šetří minuty Actions)
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # jako python:3.12-slim v Dockerfile
      - run: python -m compileall -q nokturno baleni
      - run: python -m unittest discover -s tests -v
